<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialHub - Connect with Friends</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Auth Modal -->
    <div id="authModal" class="modal active">
        <div class="modal-content auth-modal">
            <h2 id="authTitle">Welcome to SocialHub</h2>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="btn-primary">Login</button>
                <p class="auth-switch">Don't have an account? <span onclick="showRegisterForm()">Sign up</span></p>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" style="display: none;">
                <input type="text" id="registerUsername" placeholder="Username" required minlength="3">
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="text" id="registerFullName" placeholder="Full Name" required>
                <input type="password" id="registerPassword" placeholder="Password" required minlength="6">
                <button type="submit" class="btn-primary">Sign Up</button>
                <p class="auth-switch">Already have an account? <span onclick="showLoginForm()">Login</span></p>
            </form>

            <p id="authError" class="error-message"></p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar" style="display: none;">
        <div class="nav-container">
            <h1 class="logo">SocialHub</h1>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Search users..." onkeyup="searchUsers()">
                <div id="searchResults" class="search-results"></div>
            </div>
            <div class="nav-links">
                <button onclick="showFeed()" class="nav-btn active" id="feedBtn">
                    <span class="icon">🏠</span> Home
                </button>
                <button onclick="showProfile(currentUser.id)" class="nav-btn" id="profileBtn">
                    <span class="icon">👤</span> Profile
                </button>
                <button onclick="logout()" class="nav-btn">
                    <span class="icon">🚪</span> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div id="mainContent" class="main-content" style="display: none;">
        <!-- Feed View -->
        <div id="feedView" class="view active">
            <div class="container">
                <div class="feed-layout">
                    <!-- Create Post -->
                    <div class="create-post-card">
                        <h3>Create Post</h3>
                        <form id="createPostForm">
                            <textarea id="postContent" placeholder="What's on your mind?" rows="3" required></textarea>
                            <input type="file" id="postImage" accept="image/*" style="display: none;">
                            <div class="create-post-actions">
                                <button type="button" class="btn-secondary" onclick="document.getElementById('postImage').click()">
                                    📷 Add Photo
                                </button>
                                <button type="submit" class="btn-primary">Post</button>
                            </div>
                            <p id="selectedFileName" class="selected-file"></p>
                        </form>
                    </div>

                    <!-- Posts Feed -->
                    <div id="postsContainer" class="posts-container">
                        <p class="loading">Loading posts...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile View -->
        <div id="profileView" class="view">
            <div class="container">
                <div class="profile-header" id="profileHeader">
                    <!-- Profile content loaded dynamically -->
                </div>
                <div id="profilePosts" class="posts-container">
                    <!-- User posts loaded dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Comment Modal -->
    <div id="commentModal" class="modal">
        <div class="modal-content comment-modal">
            <span class="close" onclick="closeCommentModal()">&times;</span>
            <h3>Comments</h3>
            <div id="commentsContainer" class="comments-container">
                <!-- Comments loaded dynamically -->
            </div>
            <form id="addCommentForm" class="add-comment-form">
                <input type="text" id="commentInput" placeholder="Add a comment..." required>
                <button type="submit" class="btn-primary">Post</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
